[package]
name = "ctlyrics"
version = "0.1.5"
authors = ["MRsoymilk <codermrsoymilk@gmail.com>"]
description = "A terminal lyrics viewer and mapping manager for cmus"
license = "MIT"
repository = "https://github.com/MRsoymilk/ctlyrics"
readme = "README.en.md"
keywords = ["cmus", "lyrics", "terminal", "tui", "music"]
categories = ["command-line-utilities", "multimedia::audio"]
edition = "2024"
rust-version = "1.88"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "string"] }
dirs = "6"
walkdir = "2"
unicode-width = "0.2"

# Web server
axum = { version = "0.8", features = ["multipart"] }
askama = "0.12"
tokio = { version = "1", features = ["full"] }
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
x11rb = "0.13"
