{% extends "base.html" %}
{% block title %}{% if mapping %}编辑映射{% else %}新建映射{% endif %} - ctlyrics{% endblock %}
{% block content %}
<h1>{% if mapping %}编辑映射{% else %}新建映射{% endif %}</h1>

<form method="post" enctype="multipart/form-data">
    <div class="form-group">
        <label>标题 *</label>
        <input type="text" name="title" value="{% if mapping %}{{ mapping.title }}{% endif %}" required>
    </div>
    <div class="form-group">
        <label>艺术家 *</label>
        <input type="text" name="artist" value="{% if mapping %}{{ mapping.artist }}{% endif %}" required>
    </div>
    <div class="form-group">
        <label>歌词文件名 (.lrc) *</label>
        <input type="text" name="lrc_filename" value="{% if mapping %}{{ mapping.lrc_filename }}{% endif %}" required placeholder="example.lrc">
        <small>文件需放在 lyrics/ 目录下</small>
    </div>
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="/mappings" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
